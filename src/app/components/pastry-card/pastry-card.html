<div class="group cursor-pointer">
  <div class="relative overflow-hidden aspect-[4/5] mb-6 shadow-sm hover:shadow-xl transition-shadow duration-500 bg-white">
    <img [src]="image" [alt]="name" class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-700 ease-in-out" />
    <div class="absolute inset-0 bg-espresso-900/0 group-hover:bg-espresso-900/10 transition-colors duration-500"></div>
    <div class="absolute bottom-0 left-0 w-full p-6 translate-y-4 opacity-0 group-hover:translate-y-0 group-hover:opacity-100 transition-all duration-500 flex justify-center">
      <button class="bg-cream-50 text-espresso-900 uppercase tracking-widest text-[10px] font-bold px-8 py-3 hover:bg-caramel-500 hover:text-cream-50 transition-colors shadow-lg">
        Quick Add
      </button>
    </div>
  </div>
  <div class="text-center">
    <h4 class="text-xl font-serif text-espresso-900 mb-2 group-hover:text-caramel-500 transition-colors">{{name}}</h4>
    <p class="text-sm text-charcoal/70 mb-3 font-light px-4 line-clamp-2">{{description}}</p>
    <p class="text-sm font-medium text-espresso-800">{{price}}</p>
  </div>
</div>
