<section class="py-24 px-6 lg:px-16 bg-white" id="menu">
  <div class="max-w-7xl mx-auto">
    
    <div class="text-center mb-12">
      <h2 class="text-xs tracking-[0.2em] text-caramel-500 uppercase font-semibold mb-4">Discover Our Treats</h2>
      <h3 class="text-4xl md:text-5xl font-serif text-espresso-900">Full Menu</h3>
      <div class="w-16 h-[1px] bg-caramel-400 mx-auto mt-8"></div>
    </div>

    <!-- Category Filters -->
    <div class="flex flex-wrap justify-center gap-6 mb-16">
      <button 
        (click)="setCategory('All')"
        [class]="selectedCategory() === 'All' ? 'bg-espresso-900 text-cream-50' : 'bg-cream-100 text-espresso-900 hover:bg-caramel-100'"
        class="px-6 py-2 rounded-full text-sm font-semibold tracking-wider uppercase transition-colors duration-300">
        All
      </button>
      
      <button *ngFor="let cat of categories()"
        (click)="setCategory(cat.name)"
        [class]="selectedCategory() === cat.name ? 'bg-espresso-900 text-cream-50' : 'bg-cream-100 text-espresso-900 hover:bg-caramel-100'"
        class="flex items-center gap-3 px-6 py-2 rounded-full text-sm font-semibold tracking-wider uppercase transition-colors duration-300">
        <span>{{ cat.name }}</span>
      </button>
    </div>

    <!-- Loading Skeleton -->
    <div *ngIf="isLoading()" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
      <div *ngFor="let i of [1,2,3,4,5,6,7,8]" class="flex flex-col h-full bg-cream-50 shadow-sm rounded-sm overflow-hidden border border-cream-200 animate-pulse">
        <div class="h-64 w-full bg-caramel-100/50"></div>
        <div class="p-6 flex flex-col flex-grow">
          <div class="h-3 bg-caramel-200 w-1/3 mb-4 rounded"></div>
          <div class="h-6 bg-caramel-200 w-3/4 mb-4 rounded"></div>
          <div class="h-4 bg-cream-200 w-full mb-2 rounded"></div>
          <div class="h-4 bg-cream-200 w-5/6 mb-6 rounded"></div>
          <div class="mt-auto pt-4 border-t border-cream-200 flex justify-between items-center">
            <div class="h-5 bg-caramel-200 w-1/4 rounded"></div>
            <div class="h-10 w-10 bg-cream-200 rounded-full"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Product Grid -->
    <div *ngIf="!isLoading()" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
      <div *ngFor="let pastry of filteredPastries()" (click)="goToProduct(pastry.sampleProductId)" class="group cursor-pointer flex flex-col h-full bg-cream-50 shadow-sm hover:shadow-xl transition-shadow duration-300 rounded-sm overflow-hidden border border-cream-200">
        
        <!-- Image Container with Fallback -->
        <div class="relative h-64 w-full overflow-hidden bg-gradient-to-br from-cream-200 to-caramel-100">
          <!-- Placeholder if image fails to load or is missing -->
          <div *ngIf="hasImageFailed(pastry.image) || !pastry.image" class="absolute inset-0 flex items-center justify-center text-caramel-600/50">
            <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
          </div>

          <!-- Actual Image -->
          <img *ngIf="!hasImageFailed(pastry.image)" 
               [src]="pastry.image" 
               [alt]="pastry.groupName"
               (error)="onImageError($event, pastry.image)"
               class="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-700 ease-out z-10 relative">
        </div>

        <!-- Content -->
        <div class="p-6 flex flex-col flex-grow">
          <p class="text-[10px] uppercase tracking-widest text-caramel-600 font-semibold mb-2">{{ pastry.category }}</p>
          <h4 class="text-xl font-serif text-espresso-900 mb-2 group-hover:text-caramel-600 transition-colors">{{ pastry.groupName }}</h4>
          <p class="text-sm text-gray-600 mb-6 flex-grow">{{ pastry.flavorsCount }} Flavours Available<br><span class="text-xs text-gray-400">{{ pastry.flavors.join(' • ') }}</span></p>
          
          <div class="flex items-end justify-between mt-auto pt-4 border-t border-cream-200">
            <div>
              <div class="text-lg font-semibold text-espresso-900 mb-1 flex items-baseline gap-1">
                <span class="text-sm text-gray-500 mr-1">from</span>
                <span>₹{{ pastry.minPrice }}</span>
              </div>
            </div>
            
            <div class="flex items-center gap-2">
              <span class="text-xs font-bold uppercase tracking-widest text-caramel-600 group-hover:text-espresso-900 transition-colors">
                View Details &rarr;
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>
    
  </div>
</section>
