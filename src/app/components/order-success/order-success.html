<div class="min-h-screen bg-[#fdfbf7] pt-24 pb-12 font-inter flex flex-col justify-center items-center">
  <div class="container mx-auto px-4 max-w-md text-center">
    <div class="bg-white rounded-2xl shadow-sm border border-[#f1e8d5] p-6 sm:p-10">
      <h2 class="text-3xl font-playfair font-bold text-espresso-900 mb-4">Order Successful!</h2>
      <p class="text-gray-600 mb-6 font-inter">
        Thank you for your purchase. We've received your order and it's now being processed.
      </p>

      <div class="bg-caramel-50 rounded-lg p-4 mb-8 border border-caramel-100 flex items-start gap-3 text-left">
        <svg class="w-5 h-5 text-caramel-600 mt-0.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
        <p class="text-sm text-caramel-900 font-medium leading-relaxed">
          Please check your email for your order confirmation and a link to track your delivery.
        </p>
      </div>

      <a routerLink="/" 
         class="inline-block bg-espresso-900 text-white font-inter font-medium px-8 py-3 rounded-full hover:bg-espresso-800 transition-colors w-full shadow-md hover:shadow-lg mb-3">
        Back to Menu
      </a>
      <a *ngIf="orderId" [routerLink]="['/track-order', orderId]"
         class="inline-block bg-white text-espresso-900 border border-espresso-900 font-inter font-medium px-8 py-3 rounded-full hover:bg-espresso-50 transition-colors w-full shadow-sm hover:shadow">
        View Order Details
      </a>

      <p class="text-xs text-gray-400 font-inter mt-4">
        You may close this window.
      </p>
    </div>
  </div>
</div>
